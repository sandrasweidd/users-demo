spring.application.name=users-demo

# H2 = database bel memory. Kel ma ta3mol restart btfadda.
spring.datasource.url=jdbc:h2:mem:usersdb
spring.datasource.username=sa
spring.datasource.password=

# JPA bi3mol el tables automatic men el Entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console la tshouf el database bel browser: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:usersdb , user: sa , password fadi)
spring.h2.console.enabled=true

# Ya3ni lamma ykoun fi error, raje3 el message lal client
server.error.include-message=always
